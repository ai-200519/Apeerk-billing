table:
  name: subscription
  schema: public
object_relationships:
  - name: customer
    using:
      foreign_key_constraint_on: customer_id
  - name: material
    using:
      foreign_key_constraint_on: material_id
array_relationships:
  - name: invoices
    using:
      foreign_key_constraint_on:
        column: subscription_id
        table:
          name: invoice
          schema: public
